# TrueNAS SCALE → Apps → Discover Apps → ⋮ → "Install via YAML"
#
# Twee containers:
#  - tailscale: zet de app in je tailnet als https://workout.<tailnet>.ts.net
#    (HTTPS is nodig voor de PWA: service worker/offline en "scherm aan").
#  - pocketbase: draait in het netwerk van de tailscale-container. Er wordt
#    geen enkele poort op de NAS geopend.
#
# Vervang TS_AUTHKEY door een auth key uit https://login.tailscale.com/admin/settings/keys
# en pas /mnt/Opslag/apps/workout aan als je dataset ergens anders staat.

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: workout-ts
    hostname: workout
    restart: unless-stopped
    environment:
      TS_AUTHKEY: tskey-auth-VERVANG-MIJ
      TS_HOSTNAME: workout
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /mnt/Opslag/apps/workout/tailscale/state:/var/lib/tailscale
      - /mnt/Opslag/apps/workout/tailscale/config:/config

  pocketbase:
    image: alpine:3
    container_name: workout-pb
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      TZ: Europe/Amsterdam
    # Het PocketBase-binary, de frontend en de migraties worden door de
    # GitHub Actions-workflow in /mnt/Opslag/apps/workout gezet.
    command:
      - /pb/bin/pocketbase
      - serve
      - --http=127.0.0.1:8090
      - --dir=/pb/pb_data
      - --publicDir=/pb/pb_public
      - --migrationsDir=/pb/pb_migrations
      - --automigrate=false
      - --dev=false
    volumes:
      - /mnt/Opslag/apps/workout:/pb
