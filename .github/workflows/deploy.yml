name: Deploy workout

# Zelfde recept als Wortschatz en journey: de self-hosted runner op de NAS
# (myoung34/github-runner, label "truenas") bouwt de app en kopieert hem naar
# twee datasets die ook in de PocketBase-app gekoppeld zijn:
#   workout-public     → runner: /deploy      · PocketBase: /pb_public
#   workout-migrations → runner: /migrations  · PocketBase: /pb_migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Alleen gebruikt om de migraties vooraf te testen op een lege database.
  PB_VERSION: "0.40.4"

jobs:
  deploy:
    runs-on: [self-hosted, truenas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installeren, testen en bouwen
        working-directory: web
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - name: Migraties controleren op een lege testdatabase
        run: |
          set -eu
          APP_DIR="$RUNNER_TEMP/pb" sh deploy/install-pocketbase.sh
          tmp="$(mktemp -d)"
          "$RUNNER_TEMP/pb/bin/pocketbase" migrate up --dir="$tmp" --migrationsDir=pb_migrations
          rm -rf "$tmp"

      - name: Controleren of de mappen gekoppeld zijn
        run: |
          for d in /deploy /migrations; do
            if [ ! -d "$d" ] || [ ! -w "$d" ]; then
              echo "::error::$d is niet (schrijfbaar) gekoppeld in de runner-app. Koppel de juiste dataset op $d."
              exit 1
            fi
          done

      - name: Frontend naar /deploy kopiëren
        run: |
          set -eu
          rm -rf /deploy/*
          cp -R web/dist/. /deploy/
          chmod -R a+rX /deploy

      - name: Migraties naar /migrations kopiëren
        run: |
          set -eu
          before="$(cd /migrations && ls *.js 2>/dev/null | sort || true)"
          rm -f /migrations/*.js
          cp pb_migrations/*.js /migrations/
          chmod -R a+rX /migrations
          after="$(cd /migrations && ls *.js | sort)"
          if [ "$before" != "$after" ]; then
            echo "::warning::Nieuwe database-migratie. Herstart de PocketBase-app (workout-pb) in TrueNAS, dan voert hij hem uit."
          fi
